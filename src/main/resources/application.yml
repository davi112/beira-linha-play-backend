debug: false

spring:
  application:
    name: beira-linha-play-api
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: ${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:10}
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        generate_statistics: false
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN

app:
  allowed-hosts: "${APP_ALLOWED_HOSTS:}"
  jwt:
    secret: ${JWT_SECRET}
    access-token-minutos: 15
    refresh-token-dias: 7
  cookie:
    secure: ${APP_COOKIE_SECURE}
    same-site: ${APP_COOKIE_SAME_SITE}
    access-name: blp_access
    refresh-name: blp_refresh
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: gemini-2.5-flash
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}
    folder: ${CLOUDINARY_FOLDER:medalhas}
  sympla:
    api-key: ${SYMPLA_API_KEY}